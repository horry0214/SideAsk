name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: vscode-extension/package-lock.json

      - name: Install VS Code packaging tools
        run: npm ci --prefix vscode-extension --ignore-scripts

      - name: Verify browser, Gateway, and VS Code Companion
        run: npm run check

      - name: Build VSIX
        run: npm run package:vscode

      - name: Upload VSIX artifact
        uses: actions/upload-artifact@v4
        with:
          name: sideask-vscode-0.6.0
          path: dist/sideask-vscode-0.6.0.vsix
          if-no-files-found: error
