<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900" role="img" aria-labelledby="title desc">
  <title id="title">SideAsk in action</title>
  <desc id="desc">A browser article with selected text and a quiet SideAsk panel answering a contextual side question.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#f8f7ff"/><stop offset="0.55" stop-color="#ffffff"/><stop offset="1" stop-color="#eef3ff"/></linearGradient>
    <linearGradient id="markA" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#b69bff"/><stop offset="1" stop-color="#625bf6"/></linearGradient>
    <linearGradient id="markB" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#625bf6"/><stop offset="1" stop-color="#4338ff"/></linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="160%"><feDropShadow dx="0" dy="18" stdDeviation="28" flood-color="#1f2452" flood-opacity="0.12"/></filter>
    <filter id="soft" x="-30%" y="-30%" width="160%" height="160%"><feDropShadow dx="0" dy="10" stdDeviation="14" flood-color="#625bf6" flood-opacity="0.18"/></filter>
    <style>
      text { font-family: Inter, ui-sans-serif, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; fill: #111827; }
      .muted { fill: #6b7280; } .tiny { font-size: 17px; } .body { font-size: 21px; }
      .label { font-size: 18px; font-weight: 650; } .heading { font-size: 33px; font-weight: 750; letter-spacing: -0.4px; }
      .brand { font-size: 28px; font-weight: 780; letter-spacing: -0.4px; } .inverse { fill: #ffffff; }
    </style>
  </defs>
  <rect width="1600" height="900" rx="44" fill="url(#bg)"/>
  <circle cx="129" cy="80" r="190" fill="#c8bbff" opacity="0.2"/><circle cx="1450" cy="770" r="260" fill="#bdd2ff" opacity="0.2"/>
  <g filter="url(#shadow)">
    <rect x="70" y="86" width="982" height="716" rx="28" fill="#ffffff"/><rect x="70" y="86" width="982" height="62" rx="28" fill="#f8fafc"/><rect x="70" y="122" width="982" height="26" fill="#f8fafc"/>
    <circle cx="108" cy="117" r="8" fill="#aeb6c4"/><circle cx="135" cy="117" r="8" fill="#aeb6c4"/><circle cx="162" cy="117" r="8" fill="#aeb6c4"/>
    <rect x="211" y="102" width="560" height="31" rx="15.5" fill="#ffffff" stroke="#e5e7eb"/><circle cx="233" cy="117" r="6.5" fill="none" stroke="#aeb6c4" stroke-width="2"/><line x1="238" y1="122" x2="245" y2="129" stroke="#aeb6c4" stroke-width="2"/>
  </g>
  <text x="126" y="216" class="tiny muted">LLVM COMPILER NOTES</text><text x="126" y="272" class="heading">Static Single Assignment (SSA)</text>
  <text x="126" y="326" class="body muted">In SSA form, every variable is assigned exactly once.</text><text x="126" y="368" class="body muted">At control-flow merge points, a</text>
  <rect x="446" y="340" width="104" height="40" rx="9" fill="#dad7ff"/><text x="462" y="368" class="body" fill="#4338ca" font-weight="700">phi node</text><text x="560" y="368" class="body muted">selects the value</text>
  <text x="126" y="408" class="body muted">that corresponds to the predecessor block actually taken.</text>
  <g opacity="0.92"><rect x="126" y="476" width="706" height="178" rx="22" fill="#f8fafc" stroke="#e5e7eb"/><text x="158" y="520" class="tiny muted">EXAMPLE</text><text x="158" y="562" font-family="ui-monospace, SFMono-Regular, Consolas, monospace" font-size="20" fill="#334155">if (cond) x = 1; else x = 2;</text><text x="158" y="602" font-family="ui-monospace, SFMono-Regular, Consolas, monospace" font-size="20" fill="#334155">x₂ = phi(x₀, x₁)</text><rect x="158" y="622" width="488" height="9" rx="4.5" fill="#e2e8f0"/></g>
  <path d="M542 397 C590 425 618 421 672 441" fill="none" stroke="#7c6cff" stroke-width="3" stroke-dasharray="7 8"/>
  <g filter="url(#soft)"><rect x="630" y="416" width="153" height="58" rx="17" fill="#171a27"/><text x="659" y="453" font-size="21" font-weight="700" class="inverse">✦ Explain</text></g>
  <g filter="url(#shadow)"><rect x="1040" y="42" width="500" height="816" rx="30" fill="#ffffff" stroke="#dedff0"/><line x1="1040" y1="132" x2="1540" y2="132" stroke="#e5e7eb"/></g>
  <g transform="translate(1065 65) scale(.105)"><path d="M404 68H220C124 68 70 138 70 232c0 87 58 145 151 145h46" fill="none" stroke="url(#markA)" stroke-width="76" stroke-linecap="round"/><path d="M108 444h181c96 0 153-70 153-164 0-87-59-145-152-145h-41" fill="none" stroke="url(#markB)" stroke-width="76" stroke-linecap="round"/></g>
  <text x="1128" y="83" class="brand">SideAsk</text><text x="1128" y="111" class="tiny muted">Ask aside. Stay on track.</text><text x="1458" y="88" font-size="24" class="muted">—  ×</text>
  <text x="1076" y="171" class="tiny muted">YOU SELECTED</text><rect x="1075" y="190" width="430" height="58" rx="16" fill="#f1f0ff"/><text x="1100" y="227" font-size="22" font-weight="720" fill="#4338ca">phi node</text>
  <g class="tiny"><rect x="1075" y="270" width="104" height="42" rx="21" fill="#625bf6"/><text x="1095" y="297" font-weight="700" class="inverse">Simple</text><rect x="1189" y="270" width="112" height="42" rx="21" fill="#ffffff" stroke="#d8dbe6"/><text x="1211" y="297">Example</text><rect x="1311" y="270" width="194" height="42" rx="21" fill="#ffffff" stroke="#d8dbe6"/><text x="1334" y="297">Why it matters</text></g>
  <rect x="1075" y="342" width="430" height="352" rx="22" fill="#fbfbfe" stroke="#e5e7eb"/>
  <text x="1103" y="387" class="label">The intuition</text><text x="1103" y="425" class="tiny muted">A phi node is a value selector at a fork</text><text x="1103" y="454" class="tiny muted">in the control-flow road. It does not run</text><text x="1103" y="483" class="tiny muted">like a normal function at runtime.</text>
  <text x="1103" y="535" class="label">In this context</text><text x="1103" y="573" class="tiny muted">If execution came from block A, choose x₀;</text><text x="1103" y="602" class="tiny muted">if it came from block B, choose x₁. SSA can</text><text x="1103" y="631" class="tiny muted">therefore keep one assignment per value.</text><rect x="1103" y="658" width="246" height="9" rx="4.5" fill="#d9d6ff"/>
  <rect x="1075" y="720" width="365" height="58" rx="17" fill="#ffffff" stroke="#d9dce7"/><text x="1098" y="756" class="tiny muted">Ask a follow-up…</text><rect x="1452" y="720" width="53" height="58" rx="17" fill="#625bf6"/><text x="1470" y="758" font-size="27" class="inverse">↑</text>
  <text x="1077" y="820" class="tiny" fill="#15803d">✓ Got it</text><text x="1170" y="820" class="tiny" fill="#b45309">? Still fuzzy</text><text x="1310" y="820" class="tiny muted">↩ Back to source</text>
  <g transform="translate(96 744)"><rect width="860" height="38" rx="19" fill="#f1f0ff"/><text x="28" y="26" class="tiny" fill="#4338ca" font-weight="650">READ</text><text x="114" y="26" class="tiny muted">→</text><text x="158" y="26" class="tiny" fill="#4338ca" font-weight="650">ASK ASIDE</text><text x="299" y="26" class="tiny muted">→</text><text x="343" y="26" class="tiny" fill="#4338ca" font-weight="650">UNDERSTAND</text><text x="508" y="26" class="tiny muted">→</text><text x="552" y="26" class="tiny" fill="#4338ca" font-weight="650">RETURN</text><text x="662" y="26" class="tiny muted">→</text><text x="706" y="26" class="tiny" fill="#4338ca" font-weight="650">REMEMBER</text></g>
</svg>
